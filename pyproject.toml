[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-schema-erd"
version = "0.1.0"
description = "Convert PostgreSQL schema SQL files into ERD PNGs using Graphviz."
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
pg-schema-erd = "pg_schema_erd.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
